name: Build, Test, and Release

on:
  push:
    branches:
      - *
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile program
        run: g++ -std=c++17 main.cpp -o noughts-crosses

      - name: Upload program artifact
        uses: actions/upload-artifact@v7
        with:
          name: noughts-crosses
          path: noughts-crosses

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile tests
        run: g++ -std=c++17 -I. tests/runner.cpp -o noughts-crosses-tests

      - name: Run tests
        run: ./noughts-crosses-tests

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download program artifact
        uses: actions/download-artifact@v8
        with:
          name: noughts-crosses

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ github.run_number }}
        run: |
          chmod +x noughts-crosses
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"
          gh release create "$TAG_NAME" \
            noughts-crosses \
            --title "$TAG_NAME" \
            --notes "Automated release created after successful build and test jobs."
